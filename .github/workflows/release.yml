name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos:
    # Apple Silicon と Intel の両方で動くユニバーサルビルドを作る。アドホック署名のみで公証していない。
    runs-on: macos-latest
    permissions:
      contents: write
    # 4 リポジトリの既存 run の実測 1〜4 分の約 5 倍。
    timeout-minutes: 20

    steps:
      - name: Check tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=タグの形式::タグは vX.Y.Z の形で付ける(例: v1.2.3): $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # write 権限の job でキャッシュを復元しない。
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@"$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Build application
        run: scripts/bundle.sh "$GITHUB_REF_NAME"

      # main.go が frontend/dist を go:embed するため、ビルドの後に実行する。
      - name: Test
        run: |
          go vet ./...
          go test ./...
          cd frontend && npm test
          npm run lint

      - name: Verify app
        shell: bash
        run: |
          app=build/bin/nullops.app
          codesign --verify --strict "$app" || { echo "::error title=成果物の検証::署名の検証に失敗した"; exit 1; }
          actual=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          if [[ "$actual" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error title=成果物の検証::Info.plist のバージョン $actual がタグ $GITHUB_REF_NAME と一致しない"
            exit 1
          fi
          archs=$(lipo -archs "$app/Contents/MacOS/nullops")
          if [[ " $archs " != *" x86_64 "* || " $archs " != *" arm64 "* ]]; then
            echo "::error title=成果物の検証::実行ファイルのアーキテクチャ $archs に x86_64 と arm64 がそろっていない"
            exit 1
          fi

      - name: Create zip
        run: ditto -c -k --keepParent build/bin/nullops.app "build/bin/nullops-$GITHUB_REF_NAME.zip"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/bin/nullops-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
